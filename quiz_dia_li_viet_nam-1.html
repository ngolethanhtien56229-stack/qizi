a phương Bắc.", "Khối khí nhiệt đới ẩm Bắc Ấn Độ Dương.", "Khối khí lạnh di chuyển lệch đông qua biển.", "Ảnh hưởng của gió mùa mùa hạ đến sớm."], "answer": 2}, {"id": 16, "label": "Bài 2 - Câu 6", "question": "Tính chất nhiệt đới của khí hậu nước ta được quy định bởi", "options": ["Ảnh hưởng của Biển Đông rộng lớn.", "Ảnh hưởng sâu sắc hoàn lưu gió mùa.", "Vị trí nằm trong vùng nội chí tuyến.", "Chuyển động biểu kiến của Mặt Trời."], "answer": 2}, {"id": 17, "label": "Bài 2 - Câu 7", "question": "Gió nào sau đây gây mưa phùn ở vùng ven biển và các đồng bằng Bắc Bộ, Bắc Trung Bộ?", "options": ["Gió mùa Đông Bắc.", "Tín phong bán cầu Bắc.", "Gió Tây Nam.", "Tín phong bán cầu Nam."], "answer": 0}, {"id": 18, "label": "Bài 2 - Câu 8", "question": "Thời kì chuyển tiếp hoạt động giữa gió mùa Đông Bắc và Tây Nam là thời kì hoạt động mạnh của", "options": ["Gió mùa mùa đông.", "Gió mùa mùa hạ.", "Gió Tín phong BCB.", "Gió địa phương."], "answer": 2}, {"id": 19, "label": "Bài 2 - Câu 9", "question": "Loại gió nào sau đây gây mưa trên phạm vi cả nước vào mùa hạ?", "options": ["Gió Đông Nam từ biển tiến tính.", "Gió Tín phong bán cầu Bắc.", "Gió Tây Nam từ vịnh Bengal.", "Gió Tín phong bán cầu Nam."], "answer": 3}, {"id": 20, "label": "Bài 2 - Câu 10", "question": "Khu vực nào sau đây chịu ảnh hưởng mạnh nhất của gió phơn Tây Nam?", "options": ["Tây Nguyên.", "Duyên hải Nam Trung Bộ.", "Tây Bắc.", "Bắc Trung Bộ."], "answer": 3}, {"id": 21, "label": "Bài 2 - Câu 11", "question": "Loại gió thịnh hành từ tháng 11 đến tháng 4 năm sau ở phần lãnh thổ phía Nam nước ta là", "options": ["Gió mùa Đông Bắc.", "Tín phong bán cầu Bắc.", "Gió mùa Tây Nam.", "Tín phong bán cầu Nam."], "answer": 0}, {"id": 22, "label": "Bài 2 - Câu 12", "question": "Tín phong bán cầu Bắc làm cho khí hậu vùng ven biển Trung Bộ nước ta có", "options": ["Mưa lớn vào đầu mùa hạ.", "Lượng bức xạ Mặt Trời lớn.", "Hai mùa khác nhau rõ rệt.", "Mưa nhiều vào thu đông."], "answer": 3}, {"id": 23, "label": "Bài 2 - Câu 13", "question": "“Gió mùa Đông Nam” hoạt động ở Bắc Bộ có nguồn gốc từ", "options": ["Áp cao cận chí tuyến bán cầu Bắc.", "Áp cao cận chí tuyến bán cầu Nam.", "Khối khí cực lục địa từ áp cao Xi-bia.", "Khối khí nhiệt đới ẩm Bắc Ấn Độ Dương."], "answer": 1}, {"id": 24, "label": "Bài 2 - Câu 14", "question": "Nguyên nhân chủ yếu nào sau đây làm cho sông ngòi nước ta có hàm lượng phù sa lớn?", "options": ["Mạng lưới sông ngòi dày đặc.", "Chế độ nước thay đổi theo mùa.", "Tổng lượng dòng chảy lớn.", "Xâm thực mạnh ở miền núi."], "answer": 3}, {"id": 25, "label": "Bài 2 - Câu 15", "question": "Loại gió nào sau đây vừa gây mưa cho vùng ven biển Trung Bộ, vừa là nguyên nhân chính tạo nên mùa khô ở Nam Bộ và Tây Nguyên?", "options": ["Gió mùa Đông Bắc.", "Tín phong bán cầu Nam.", "Gió mùa Tây Nam.", "Tín phong bán cầu Bắc."], "answer": 3}, {"id": 26, "label": "Bài 2 - Câu 16", "question": "Loại gió nào sau đây vừa gây mưa cho vùng ven biển Trung Bộ, vừa là nguyên nhân chính tạo nên mùa khô ở Nam Bộ và Tây Nguyên?", "options": ["Gió mùa Đông Bắc.", "Tín phong bán cầu Nam.", "Gió mùa Tây Nam.", "Tín phong bán cầu Bắc."], "answer": 3}, {"id": 27, "label": "Bài 2 - Câu 17", "question": "Gió Tây Nam hoạt động trong thời kì đầu mùa hạ ở nước ta có nguồn gốc từ", "options": ["Khối khí nhiệt đới ẩm Bắc Ấn Độ Dương.", "Khối khí chí tuyến bán cầu Nam.", "Khối khí nhiệt đới Nam Thái Bình Dương.", "Khối khí chí tuyến Bắc bán cầu."], "answer": 0}, {"id": 28, "label": "Bài 2 - Câu 18", "question": "Giữa Tây Nguyên và ven biển Trung Bộ nước ta có đặc điểm gì nổi bật?", "options": ["Giống nhau về mùa mưa.", "Đối lập nhau về mùa mưa và mùa khô.", "Giống nhau về mùa khô.", "Đối lập nhau về mùa nóng và mùa lạnh."], "answer": 1}, {"id": 29, "label": "Bài 2 - Câu 19", "question": "Thời tiết nóng và khô ở ven biển Trung Bộ và phần nam của khu vực Tây Bắc nước ta do loại gió nào sau đây gây ra?", "options": ["Gió mùa Đông Bắc.", "Tín phong bán cầu Nam.", "Gió Tây Nam đầu mùa.", "Tín phong bán cầu Bắc."], "answer": 2}, {"id": 30, "label": "Bài 2 - Câu 20", "question": "Sông ngòi nước ta có đặc điểm nào sau đây?", "options": ["Phần lớn sông đều dài dốc và dễ bị lũ lụt.", "Có lưu lượng lớn, hàm lượng phù sa cao.", "Lượng nước phân bố đồng đều ở các hệ thống sông.", "Phần lớn sông có hướng đông nam – tây bắc."], "answer": 1}, {"id": 31, "label": "Bài 2 - Câu 21", "question": "Nước ta có mạng lưới sông ngòi dày đặc chủ yếu do", "options": ["Khí hậu phân mùa, lãnh thổ hẹp ngang.", "Xâm thực, bóc mòn mạnh ở miền đồi núi.", "Mưa lớn, địa hình đồi núi chia cắt mạnh.", "Chế độ nước theo mùa, giáp Biển Đông."], "answer": 2}, {"id": 32, "label": "Bài 2 - Câu 22", "question": "Nguyên nhân gây mưa chủ yếu vào mùa hạ cho nước ta là do", "options": ["Khối khí chí tuyến Bắc Ấn Độ Dương.", "Gió mùa Tây Nam và dải hội tụ nhiệt đới.", "Địa hình và hoàn lưu khí quyển.", "Hoạt động của bão và gió Tín phong."], "answer": 1}];
let i=0,score=0,answered=false;
function render(){
 answered=false; document.getElementById('feedback').innerHTML=''; document.getElementById('next').classList.add('hidden');
 const q=qs[i]; document.getElementById('quiz').innerHTML=`<div class="q">${q.label}<br><br>${q.question}</div>`+
 q.options.map((x,j)=>`<label class="opt"><input type="radio" name="a" value="${j}" onchange="answer(${j})"> <b>${String.fromCharCode(65+j)}.</b> ${x}</label>`).join('');
 document.getElementById('count').textContent=`Câu ${i+1} / ${qs.length}`;
 document.getElementById('bar').style.width=`${(i/qs.length)*100}%`;
}
function answer(j){
 if(answered)return; answered=true; const q=qs[i];
 if(j===q.answer){score++;document.getElementById('feedback').innerHTML='✅ Chính xác!';}
 else{document.getElementById('feedback').innerHTML=`❌ Chưa đúng. Đáp án: <b>${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</b>`;}
 document.getElementById('next').classList.remove('hidden');
}
function nextQ(){
 if(!answered)return;
 i++; if(i>=qs.length){document.getElementById('quiz').innerHTML=`<div class="result">🎉 Hoàn thành!<br><br>Bạn đúng <b>${score}/${qs.length}</b> câu.</div>`;document.getElementById('feedback').innerHTML=score/qs.length>=.8?'🌟 Rất tốt!':score/qs.length>=.6?'👍 Khá tốt!':'📚 Hãy ôn lại bài nhé!';document.getElementById('next').classList.add('hidden');document.getElementById('bar').style.width='100%';document.getElementById('count').textContent='Đã hoàn thành';}else render();
}
render();
</script></body></html>
